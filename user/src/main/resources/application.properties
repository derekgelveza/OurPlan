spring.application.name=user
# Calendar runs on 8080; the user (auth) app needs its own port to run alongside it
server.port=${USER_SERVICE_PORT:8081}

#Database Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway migrations own the schema (same as the calendar app); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
# Calendar's migrations (V3, V4) aren't in this module; don't fail when the shared database has them
spring.flyway.ignore-migration-patterns=*:missing

#JWT secret key
security.jwt.secret-key =${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

#API security
# Browser origins allowed by CORS (comma-separated). Native React Native apps don't need one; 8081 is Expo web.
ourplan.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
# Requests per minute, per IP, to each /auth endpoint
ourplan.security.auth-requests-per-minute=10

#Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# .env is read from the folder the app starts in, or its parent (the project root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
