spring.application.name=user

# In-memory H2 in PostgreSQL mode so tests run without a real database
spring.datasource.url=jdbc:h2:mem:ourplan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

# Test-only JWT key (not a real secret)
security.jwt.secret-key=dGVzdC1vbmx5LWtleS1mb3ItdW5pdC10ZXN0cy0zMi1ieXRlcy1sb25nISE=
security.jwt.expiration-time=3600000
