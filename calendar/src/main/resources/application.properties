spring.application.name=calendar

# PostgreSQL / Supabase connection (set these environment variables; do not commit credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed by Flyway: V1 (users) comes from the user module, V2 (calendar) from this module
spring.jpa.hibernate.ddl-auto=validate

# Calendar invites: link sent to the invitee, and how long it stays valid
ourplan.invite.base-url=${INVITE_BASE_URL:http://localhost:8080}
ourplan.invite.expiry-days=7
