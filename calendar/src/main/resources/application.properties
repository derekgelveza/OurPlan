spring.application.name=calendar

# .env is read from the folder the app starts in, or its parent (the project root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL / Supabase connection (set these environment variables; do not commit credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed by Flyway: V1, V2, V5 and V6 (users) live in the user module, V3 and V4 (calendar) in this module
spring.jpa.hibernate.ddl-auto=validate

# Calendar invites: link sent to the invitee, and how long it stays valid
ourplan.invite.base-url=${INVITE_BASE_URL:http://localhost:8080}
ourplan.invite.expiry-days=7

# TEMP-AUTH-DISABLED: Local-only switch; leave false (or unset) when security is required.
# Set DISABLE_AUTH=true in the environment to enable the reversible test bypass.
ourplan.security.bypass-user-id=${OURPLAN_BYPASS_USER_ID:1}

# JWT: must be the SAME secret as the user app, so the tokens it issues are accepted here
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Browser origins allowed by CORS (comma-separated); native React Native apps don't need one
ourplan.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
